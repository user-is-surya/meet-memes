<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Meet Memes</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { width: 360px; padding: 14px; }
    header img { width: 28px; height: 28px; }
    header h1 { font-size: 16px; }
    .meme .name { font-weight: 600; }
    .meme .how { color: var(--muted); font-size: 12px; }
    .settings { display: grid; gap: 8px; }
    footer { margin-top: 14px; display: flex; gap: 8px; }
    footer > * { flex: 1; text-align: center; }
    .off .memes, .off .settings { opacity: .45; pointer-events: none; }
    .status { display: grid; gap: 4px; }
    .status .line { display: flex; gap: 8px; }
    .status .ok::before { content: '✓'; color: #4ade80; font-weight: 700; }
    .status .bad::before { content: '✗'; color: #f87171; font-weight: 700; }
    .status .wait::before { content: '…'; color: #facc15; font-weight: 700; }
    .status .hint { color: var(--muted); font-size: 12px; padding-left: 16px; }
  </style>
</head>
<body>
  <header class="row">
    <img src="../icons/icon48.png" alt="">
    <div class="grow">
      <h1>Meet Memes</h1>
      <div class="muted small" id="version"></div>
    </div>
    <label class="switch" title="Turn everything on/off (Alt+Shift+0)">
      <input type="checkbox" id="enabled"><span></span>
    </label>
  </header>

  <div id="update" class="banner" hidden style="margin-top:12px"></div>

  <h2>Status in this tab</h2>
  <div class="card status" id="status">Checking…</div>

  <div id="body">
    <h2>Who sees the effects</h2>
    <div class="settings">
      <div class="segmented">
        <input type="radio" name="audience" id="audience-everyone" value="everyone"><label for="audience-everyone">Everyone in the call</label>
        <input type="radio" name="audience" id="audience-local" value="local"><label for="audience-local">Only me (preview)</label>
      </div>
      <div class="row"><span class="grow">Show preview window</span><label class="switch"><input type="checkbox" id="showPreview"><span></span></label></div>
      <div class="row"><span class="grow">Use mic to confirm snaps</span><label class="switch"><input type="checkbox" id="snapUsesMic"><span></span></label></div>
      <div class="row"><span class="grow">Debug overlay (landmarks)</span><label class="switch"><input type="checkbox" id="debug"><span></span></label></div>
    </div>

    <h2>Memes</h2>
    <div class="list memes" id="memes"></div>
  </div>

  <footer>
    <button class="primary" id="manage">Add your own memes</button>
    <button id="check">Check for updates</button>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
